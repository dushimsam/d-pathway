name: API CI

on:
  push:
    paths: ['api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-ci.yml']

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database for this job only; it never leaves the runner.
        # Override by setting the CI_PG_* repository secrets.
        env:
          POSTGRES_USER: ${{ secrets.CI_PG_USER || 'ci' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_PG_PASSWORD || 'ci' }}
          POSTGRES_DB: ${{ secrets.CI_PG_DB || 'ci' }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.CI_PG_USER || 'ci' }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Only migration:run touches the database; app secrets aren't needed in CI.
      DATABASE_URL: postgres://${{ secrets.CI_PG_USER || 'ci' }}:${{ secrets.CI_PG_PASSWORD || 'ci' }}@127.0.0.1:5432/${{ secrets.CI_PG_DB || 'ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migration:run
      - run: npm run test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            cd api
            npm ci
            npm run build
            npm run migration:run
            pm2 reload ecosystem.config.cjs --update-env
