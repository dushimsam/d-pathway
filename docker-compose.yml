services:
  postgres:
    image: postgres:16-alpine
    container_name: dpathway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpathway
      POSTGRES_PASSWORD: dpathway
      POSTGRES_DB: dpathway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpathway"]
      interval: 10s
      retries: 5
volumes:
  pgdata:
